# Reusable workflow: bump minor version, commit, build, pack and publish to GitHub Packages.
#
# Usage from a caller workflow:
#
#   jobs:
#     publish:
#       uses: davicbaba/pipeline-workflows/.github/workflows/publish-nuget.yml@main
#       with:
#         project_path: src/MyProject/MyProject.csproj
#         github_owner: davicbaba  # GitHub username that owns the Packages feed
#       secrets:
#         PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#
# The caller workflow must set:
#   permissions:
#     contents: write   # to commit and push the version bump
#     packages: write   # to publish the NuGet package
#
# Concurrent runs: handled here, so callers do NOT need a concurrency block.
#   - The publish job declares its own concurrency group keyed on the CALLER's workflow
#     and ref: inside a reusable workflow the github context belongs to the caller, so
#     each calling pipeline gets its own group and never bumps the same .csproj twice.
#   - Across different pipelines the push retries fetch + rebase + push with backoff,
#     which serializes the pushes without queueing whole runs.
#
# Do NOT give callers a shared concurrency group. GitHub keeps only ONE pending run per
# group, so a third run cancels the one that was waiting, with:
#   "Canceling since a higher priority waiting request for <group> exists"

name: Publish NuGet Package

on:
  workflow_call:
    inputs:
      project_path:
        description: 'Path to the .csproj file relative to the repository root'
        required: true
        type: string

      github_owner:
        description: 'GitHub username or org that owns the Packages feed'
        required: false
        type: string
        default: 'davicbaba'

    secrets:
      PUBLISH_TOKEN:
        description: 'GitHub token with contents:write and packages:write permissions'
        required: true

    outputs:
      version:
        description: 'The new version that was published'
        value: ${{ jobs.publish.outputs.version }}

jobs:
  publish:
    runs-on: ubuntu-latest

    # github.workflow / github.ref are the CALLER's, so this serializes only against
    # other runs of the same calling pipeline on the same branch. Different pipelines
    # run in parallel and rely on the rebase + retry push below.
    concurrency:
      group: csproj-bump-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false

    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use the caller's token so the version-bump commit can be pushed back.
          token: ${{ secrets.PUBLISH_TOKEN }}

      # ── .NET setup ──────────────────────────────────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          include-prerelease: true

      # ── Version bump (minor only) ────────────────────────────────────────────
      - name: Bump minor version in .csproj
        id: bump
        run: |
          PROJECT_FILE="${{ inputs.project_path }}"

          # Read current <Version> or fall back to 1.0.0
          CURRENT=$(grep -oP '(?<=<Version>)[^<]+' "$PROJECT_FILE" || true)
          if [ -z "$CURRENT" ]; then
            CURRENT="1.0.0"
          fi

          IFS='.' read -ra PARTS <<< "$CURRENT"
          MAJOR="${PARTS[0]:-1}"
          MINOR="${PARTS[1]:-0}"
          PATCH="${PARTS[2]:-0}"

          # Always bump minor; patch stays as-is
          MINOR=$((MINOR + 1))

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          # Update existing <Version> tag, or insert one before </PropertyGroup>
          if grep -q '<Version>' "$PROJECT_FILE"; then
            sed -i "s|<Version>[^<]*</Version>|<Version>${NEW_VERSION}</Version>|" "$PROJECT_FILE"
          else
            sed -i "s|</PropertyGroup>|  <Version>${NEW_VERSION}</Version>\n  </PropertyGroup>|1" "$PROJECT_FILE"
          fi

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumped ${CURRENT} → ${NEW_VERSION}"

      # ── Commit version bump ─────────────────────────────────────────────────
      # Other publish pipelines push their own bump commits concurrently, so a plain push
      # loses the race. Retry fetch + rebase + push with backoff; each pipeline touches a
      # different .csproj, so the rebase does not conflict.
      - name: Commit and push version bump
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.project_path }}"
          git commit -m "chore: bump version to ${VERSION} [skip ci]"

          max_attempts=15
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            git fetch origin "$BRANCH"
            if ! git rebase "origin/$BRANCH"; then
              echo "::error::Rebase onto origin/$BRANCH failed (likely a conflicting bump of the same .csproj). Resolve manually."
              git rebase --abort || true
              exit 1
            fi
            if git push origin "HEAD:$BRANCH"; then
              echo "Push succeeded on attempt $attempt"
              break
            fi
            echo "Push rejected (attempt $attempt/$max_attempts); another job may have pushed. Retrying..."
            sleep $((attempt * 2 + RANDOM % 6))
            attempt=$((attempt + 1))
          done
          if [ "$attempt" -gt "$max_attempts" ]; then
            echo "::error::Push failed after $max_attempts attempts"
            exit 1
          fi

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build
        run: dotnet build "${{ inputs.project_path }}" --configuration Release

      # ── Pack ────────────────────────────────────────────────────────────────
      - name: Pack
        run: |
          dotnet pack "${{ inputs.project_path }}" \
            --configuration Release \
            --no-build \
            --output ./nupkg

      # ── Publish to GitHub Packages ──────────────────────────────────────────
      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/${{ inputs.github_owner }}/index.json" \
            --api-key "${{ secrets.PUBLISH_TOKEN }}" \
            --skip-duplicate
